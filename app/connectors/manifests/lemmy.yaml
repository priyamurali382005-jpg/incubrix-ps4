key: lemmy
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types: [text, video_link]
    spec: {title_max_chars: 200, body_max_chars: 40000, links_allowed: true}
rate_limits:
  per_connection: {requests: 6, per_seconds: 600}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
instance_param: base_url
idempotent_publish: false